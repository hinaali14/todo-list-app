<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My To-Do App</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>My To-Do List</h1>
        <p class="subtitle">Organize your day, one task at a time ✨</p>

        <div class="input-section">
            <input 
                type="text" 
                id="taskInput" 
                placeholder="Enter a new task..."
            >

            <button onclick="addTask()">Add Task</button>
        </div>

        <div class="stats">
            <div>
                <span id="totalTasks">0</span>
                <p>Total</p>
            </div>

            <div>
                <span id="completedTasks">0</span>
                <p>Completed</p>
            </div>

            <div>
                <span id="pendingTasks">0</span>
                <p>Pending</p>
            </div>
        </div>

        <div class="filter-buttons">
            <button onclick="filterTasks('all')" class="active">All</button>
            <button onclick="filterTasks('pending')">Pending</button>
            <button onclick="filterTasks('completed')">Completed</button>
        </div>

        <ul id="taskList"></ul>

        <button class="clear-btn" onclick="clearCompleted()">
            Clear Completed
        </button>

    </div>

    <script src="script.js"></script>

</body>
</html>
